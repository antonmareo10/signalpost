[project]
name = "signalpost-agent"
version = "1.0.0"
description = "Evidence-first company research agent for Norwegian organisation numbers (Builderr Signalpost challenge)"
requires-python = ">=3.11"
dependencies = []  # standard library only: nothing to resolve, nothing to drift

[project.scripts]
signalpost = "signalpost.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["signalpost"]
